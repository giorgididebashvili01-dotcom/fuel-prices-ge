name: Scrape fuel prices

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Scrape prices
        run: node scraper/scrape.mjs

      - name: Commit updated data
        run: |
          git config user.name "price-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data; then
            git add data
            git commit -m "Update fuel prices ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            n=0
            until git push; do
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "Push failed after 3 attempts"; exit 1; fi
              echo "Push rejected, rebasing onto remote (attempt $n)..."
              git pull --rebase -X theirs origin main
            done
          else
            echo "No price changes."
          fi
