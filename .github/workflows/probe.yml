name: Probe proxies (temp)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try proxy candidates for gulf.ge
        run: |
          T="https://gulf.ge/ge/fuel_prices"
          E="https%3A%2F%2Fgulf.ge%2Fge%2Ffuel_prices"
          try() {
            name="$1"; url="$2"
            body=$(curl -s --max-time 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" "$url" || true)
            len=${#body}
            hits=$(printf '%s' "$body" | grep -c "prices_cnt\|ევრო დიზელი" || true)
            echo "== $name: len=$len hits=$hits"
          }
          try "allorigins"  "https://api.allorigins.win/raw?url=$E"
          try "codetabs"    "https://api.codetabs.com/v1/proxy?quest=$T"
          try "corsproxy"   "https://corsproxy.io/?url=$E"
          try "jina"        "https://r.jina.ai/$T"
          try "direct"      "$T"
